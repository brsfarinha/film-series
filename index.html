<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Ver a Dois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10192E;
    --bg-soft: #16223D;
    --card: #1C2A4A;
    --card-edge: #263759;
    --amber: #FFB627;
    --amber-dim: #C8901E;
    --red: #E5533C;
    --green: #4FB286;
    --text: #F3F1EA;
    --text-muted: #93A0BE;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, rgba(255,182,39,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  header{
    padding:36px 20px 24px;
    text-align:center;
    border-bottom:1px solid var(--card-edge);
    background: linear-gradient(180deg, rgba(255,182,39,0.06), transparent);
  }
  header h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(2.2rem, 6vw, 3.4rem);
    letter-spacing:0.04em;
    margin:0;
    color:var(--amber);
    text-shadow: 0 0 24px rgba(255,182,39,0.25);
  }
  header p{
    color:var(--text-muted);
    margin:6px 0 0;
    font-size:0.95rem;
  }
  main{
    max-width:920px;
    margin:0 auto;
    padding:24px 16px 80px;
  }
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding:6px 14px;
    border-radius:999px;
    border:1px solid var(--card-edge);
    background:var(--bg-soft);
    color:var(--text-muted);
    font-size:0.82rem;
    cursor:pointer;
    user-select:none;
    transition:all .15s ease;
  }
  .chip.active{
    background:var(--amber);
    color:#1a1200;
    border-color:var(--amber);
    font-weight:600;
  }
  button.primary{
    background:var(--amber);
    color:#1a1200;
    border:none;
    padding:10px 18px;
    border-radius:10px;
    font-weight:700;
    font-size:0.95rem;
    cursor:pointer;
    transition:transform .1s ease;
  }
  button.primary:hover{ transform:translateY(-1px); }
  button.ghost{
    background:transparent;
    border:1px solid var(--card-edge);
    color:var(--text-muted);
    padding:9px 14px;
    border-radius:10px;
    cursor:pointer;
    font-size:0.9rem;
  }
  button.ghost:hover{ color:var(--text); border-color:var(--text-muted); }

  /* form panel */
  #formPanel{
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:24px;
    display:none;
  }
  #formPanel.open{ display:block; }
  #formPanel h2{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:0.03em;
    color:var(--amber);
    margin:0 0 14px;
    font-size:1.3rem;
  }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media(max-width:560px){ .grid2{grid-template-columns:1fr;} }
  label{ font-size:0.78rem; color:var(--text-muted); display:block; margin-bottom:4px; }
  input, select, textarea{
    width:100%;
    background:var(--bg-soft);
    border:1px solid var(--card-edge);
    color:var(--text);
    padding:10px 12px;
    border-radius:8px;
    font-family:inherit;
    font-size:0.95rem;
  }
  input:focus, select:focus, textarea:focus{
    outline:2px solid var(--amber);
    outline-offset:1px;
  }
  .field{ margin-bottom:12px; }
  textarea{ resize:vertical; min-height:60px; }
  .form-actions{ display:flex; gap:10px; margin-top:6px; }

  /* ticket cards */
  #list{ display:grid; gap:14px; }
  .ticket{
    position:relative;
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:var(--radius);
    padding:16px 18px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:8px;
    align-items:start;
  }
  .ticket::before{
    content:"";
    position:absolute;
    left:0; right:0; top:52px;
    height:0;
    border-top:2px dashed var(--card-edge);
  }
  .ticket-main{ grid-column:1 / -1; display:flex; flex-direction:column; gap:8px; }
  .ticket-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .ticket-title{ font-size:1.15rem; font-weight:700; }
  .ticket-meta{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .badge{
    font-size:0.72rem;
    padding:3px 9px;
    border-radius:999px;
    border:1px solid var(--card-edge);
    color:var(--text-muted);
  }
  .badge.platform{ background:var(--bg-soft); }
  .badge.status-por_ver{ color:var(--text-muted); }
  .badge.status-a_ver{ color:var(--amber); border-color:var(--amber-dim); }
  .badge.status-visto{ color:var(--green); border-color:var(--green); }
  .ticket-notes{ color:var(--text-muted); font-size:0.88rem; white-space:pre-wrap; }
  .ticket-progress{ font-size:0.85rem; color:var(--amber); }
  .ticket-actions{ display:flex; gap:6px; padding-top:16px; }
  .icon-btn{
    background:transparent;
    border:1px solid var(--card-edge);
    color:var(--text-muted);
    width:32px; height:32px;
    border-radius:8px;
    cursor:pointer;
    font-size:0.9rem;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ color:var(--text); border-color:var(--text-muted); }
  .icon-btn.danger:hover{ color:var(--red); border-color:var(--red); }

  .empty{
    text-align:center;
    color:var(--text-muted);
    padding:60px 20px;
    border:1px dashed var(--card-edge);
    border-radius:var(--radius);
  }
  .empty strong{ color:var(--amber); display:block; font-size:1.1rem; margin-bottom:6px; }

  #status-msg{
    text-align:center;
    color:var(--text-muted);
    font-size:0.85rem;
    padding:10px;
  }
  #status-msg.error{ color:var(--red); }
</style>
</head>
<body>

<header>
  <h1>A Ver a Dois</h1>
  <p>A lista partilhada do que vamos ver — filmes, séries e documentários</p>
</header>

<main>
  <div class="toolbar">
    <div class="chips" id="filterChips"></div>
    <button class="primary" id="btnNew">+ Adicionar</button>
  </div>

  <div id="formPanel">
    <h2 id="formTitle">Novo item</h2>
    <form id="itemForm">
      <div class="grid2">
        <div class="field">
          <label for="f_name">Nome</label>
          <input id="f_name" required placeholder="Ex: Severance">
        </div>
        <div class="field">
          <label for="f_type">Tipo</label>
          <select id="f_type">
            <option value="serie">Série</option>
            <option value="filme">Filme</option>
            <option value="documentario">Documentário</option>
          </select>
        </div>
        <div class="field">
          <label for="f_platform">Streaming</label>
          <select id="f_platform">
            <option value="disney">Disney+</option>
            <option value="netflix">Netflix</option>
            <option value="hbo">HBO Max</option>
            <option value="prime">Prime Video</option>
            <option value="disco">Discovery+</option>
            <option value="tv">TV</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <div class="field">
          <label for="f_season">Season / temporada</label>
          <input id="f_season" placeholder="Ex: T2 (opcional)">
        </div>
        <div class="field">
          <label for="f_status">Estado</label>
          <select id="f_status">
            <option value="por_ver">Por ver</option>
            <option value="a_ver">A ver</option>
            <option value="visto">Visto</option>
          </select>
        </div>
        <div class="field" id="progressField">
          <label for="f_progress">Onde ficámos</label>
          <input id="f_progress" placeholder="Ex: Ep. 4, min 20">
        </div>
      </div>
      <div class="field">
        <label for="f_notes">Notas</label>
        <textarea id="f_notes" placeholder="O que quiserem anotar..."></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="primary">Guardar</button>
        <button type="button" class="ghost" id="btnCancel">Cancelar</button>
      </div>
    </form>
  </div>

  <div id="status-msg">A carregar...</div>
  <div id="list"></div>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ⚠️ Substitui pelos dados do teu projeto Supabase (ver README.md)
const SUPABASE_URL = 'https://shikoycjtdskwrudlrmb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoaWtveWNqdGRza3dydWRscm1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0ODY3ODAsImV4cCI6MjEwNTA2Mjc4MH0.yiYQM4FXPXXGRzb2EvgiM9Olb3g-qiRx6eqXReM05aw';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PLATFORM_LABELS = {
  disney: 'Disney+', netflix: 'Netflix', hbo: 'HBO Max',
  prime: 'Prime Video', disco: 'Discovery+', tv: 'TV', outro: 'Outro'
};
const TYPE_LABELS = { serie: 'Série', filme: 'Filme', documentario: 'Documentário' };
const STATUS_LABELS = { por_ver: 'Por ver', a_ver: 'A ver', visto: 'Visto' };

let items = [];
let activeFilter = 'todos';
let editingId = null;

const listEl = document.getElementById('list');
const statusMsg = document.getElementById('status-msg');
const formPanel = document.getElementById('formPanel');
const form = document.getElementById('itemForm');
const chipsEl = document.getElementById('filterChips');
const progressField = document.getElementById('progressField');

document.getElementById('btnNew').addEventListener('click', () => openForm());
document.getElementById('btnCancel').addEventListener('click', closeForm);
document.getElementById('f_status').addEventListener('change', updateProgressVisibility);

function updateProgressVisibility(){
  progressField.style.display = document.getElementById('f_status').value === 'a_ver' ? 'block' : 'none';
}

function openForm(item = null){
  editingId = item ? item.id : null;
  document.getElementById('formTitle').textContent = item ? 'Editar item' : 'Novo item';
  document.getElementById('f_name').value = item?.name || '';
  document.getElementById('f_type').value = item?.type || 'serie';
  document.getElementById('f_platform').value = item?.platform || 'netflix';
  document.getElementById('f_season').value = item?.season || '';
  document.getElementById('f_status').value = item?.status || 'por_ver';
  document.getElementById('f_progress').value = item?.progress || '';
  document.getElementById('f_notes').value = item?.notes || '';
  updateProgressVisibility();
  formPanel.classList.add('open');
  document.getElementById('f_name').focus();
}
function closeForm(){
  formPanel.classList.remove('open');
  form.reset();
  editingId = null;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    name: document.getElementById('f_name').value.trim(),
    type: document.getElementById('f_type').value,
    platform: document.getElementById('f_platform').value,
    season: document.getElementById('f_season').value.trim(),
    status: document.getElementById('f_status').value,
    progress: document.getElementById('f_progress').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
  };
  if(!payload.name) return;

  let error;
  if(editingId){
    ({ error } = await supabase.from('items').update(payload).eq('id', editingId));
  } else {
    ({ error } = await supabase.from('items').insert(payload));
  }
  if(error){ showError(error.message); return; }
  closeForm();
  await loadItems();
});

async function deleteItem(id){
  if(!confirm('Remover este item da lista?')) return;
  const { error } = await supabase.from('items').delete().eq('id', id);
  if(error){ showError(error.message); return; }
  await loadItems();
}

function showError(msg){
  statusMsg.textContent = 'Erro: ' + msg;
  statusMsg.classList.add('error');
  statusMsg.style.display = 'block';
}

function renderChips(){
  const filters = [
    ['todos','Todos'], ['por_ver','Por ver'], ['a_ver','A ver'], ['visto','Visto']
  ];
  chipsEl.innerHTML = filters.map(([key,label]) =>
    `<div class="chip ${activeFilter===key?'active':''}" data-filter="${key}">${label}</div>`
  ).join('');
  chipsEl.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeFilter = chip.dataset.filter;
      renderChips();
      renderList();
    });
  });
}

function renderList(){
  const filtered = activeFilter === 'todos'
    ? items
    : items.filter(i => i.status === activeFilter);

  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty"><strong>Nada por aqui</strong>Adiciona o primeiro filme, série ou documentário para começarem a construir a lista.</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(item => `
    <div class="ticket">
      <div class="ticket-main">
        <div class="ticket-top">
          <div>
            <div class="ticket-title">${escapeHtml(item.name)}</div>
            <div class="ticket-meta">
              <span class="badge">${TYPE_LABELS[item.type] || item.type}</span>
              <span class="badge platform">${PLATFORM_LABELS[item.platform] || item.platform}</span>
              ${item.season ? `<span class="badge">${escapeHtml(item.season)}</span>` : ''}
              <span class="badge status-${item.status}">${STATUS_LABELS[item.status] || item.status}</span>
            </div>
          </div>
        </div>
        ${item.status === 'a_ver' && item.progress ? `<div class="ticket-progress">▶ ${escapeHtml(item.progress)}</div>` : ''}
        ${item.notes ? `<div class="ticket-notes">${escapeHtml(item.notes)}</div>` : ''}
      </div>
      <div class="ticket-actions">
        <button class="icon-btn" title="Editar" data-edit="${item.id}">✎</button>
        <button class="icon-btn danger" title="Remover" data-del="${item.id}">✕</button>
      </div>
    </div>
  `).join('');

  listEl.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = items.find(i => i.id === btn.dataset.edit);
      openForm(item);
    });
  });
  listEl.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => deleteItem(btn.dataset.del));
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadItems(){
  const { data, error } = await supabase.from('items').select('*').order('created_at', { ascending: false });
  if(error){ showError(error.message); return; }
  items = data;
  statusMsg.style.display = 'none';
  renderChips();
  renderList();
}

// Atualização em tempo real entre dispositivos
supabase
  .channel('items-changes')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, () => loadItems())
  .subscribe();

loadItems();
</script>
</body>
</html>
